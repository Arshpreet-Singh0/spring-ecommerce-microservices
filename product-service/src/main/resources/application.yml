kafka:
  topic:
    product-created-topic : product-created-topic

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Publish a logical type id ("productCreated") in the __TypeId__ header instead of
        # this service's class name, so consumers can map it to their own class.
        spring.json.type.mapping: productCreated:com.ecommerce.product_service.event.ProductCreatedEvent
