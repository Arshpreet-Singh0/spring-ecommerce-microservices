# Full local stack:  cp .env.example .env && docker compose up --build -d
# Only the API gateway (8080) and the Eureka dashboard (8761) are exposed for app traffic.
# Infra is published on uncommon (overridable) host ports so it doesn't clash with local
# installs: Postgres 15432, Kafka 29092, Elasticsearch 19200. All host ports: see .env.example.

name: ecommerce

# ---------- shared settings for every Spring Boot service ----------
x-spring-service: &spring-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  mem_limit: 640m
  networks: [backend]

x-eureka-env: &eureka-env
  EUREKA_URL: http://discovery-client:8761/eureka

x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # ======================= infrastructure =======================
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      # KRaft mode: this single node is both broker and controller (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = other containers (kafka:9092), EXTERNAL = tools on the host (localhost:29092)
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [backend]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local dev only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-19200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [backend]

  zipkin:
    image: openzipkin/zipkin:3
    profiles: [tracing]   # only with: docker compose --profile tracing up
    ports:
      - "9411:9411"
    networks: [backend]

  # ======================= services =======================
  discovery-client:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: discovery-client }
    image: ecommerce/discovery-client
    ports:
      - "${EUREKA_HOST_PORT:-8761}:8761"   # Eureka dashboard
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      <<: *healthcheck-timing

  user-service:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: user-service }
    image: ecommerce/user-service
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 chars)}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9010/actuator/health"]
      <<: *healthcheck-timing

  product-service:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: product-service }
    image: ecommerce/product-service
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USERNAME: product_svc
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9020/actuator/health"]
      <<: *healthcheck-timing

  inventory-service:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: inventory-service }
    image: ecommerce/inventory-service
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_svc
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9040/actuator/health"]
      <<: *healthcheck-timing

  order-service:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: order-service }
    image: ecommerce/order-service
    environment:
      <<: *eureka-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_svc
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9050/actuator/health"]
      <<: *healthcheck-timing

  search-service:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: search-service }
    image: ecommerce/search-service
    environment:
      <<: *eureka-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      kafka: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      discovery-client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9060/actuator/health"]
      <<: *healthcheck-timing

  api-gateway:
    <<: *spring-service
    build:
      context: .
      args: { MODULE: api-gateway }
    image: ecommerce/api-gateway
    environment:
      <<: *eureka-env
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"   # the single public entry point
    depends_on:
      discovery-client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      <<: *healthcheck-timing

networks:
  backend:

volumes:
  pgdata:
  kafkadata:
  esdata:
