spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/user/**
              filters:
                - StripPrefix=2
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/product/**
              filters:
                - StripPrefix=2
            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/api/v1/search/**
              filters:
                - StripPrefix=2
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                # order-service controller is mapped to /orders
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    export:
      # Off unless a Zipkin is running (docker compose --profile tracing up)
      enabled: ${TRACING_EXPORT_ENABLED:false}
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
