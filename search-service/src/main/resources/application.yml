spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    elasticsearch:
      repositories:
        enabled: true
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Logical type ids (set by producers) -> this service's own event classes
        spring.json.type.mapping: productCreated:com.ecommerce.search_service.event.ProductCreatedEvent,inventoryUpdated:com.ecommerce.search_service.event.InventoryUpdatedEvent
        spring.json.trusted.packages: com.ecommerce.search_service.event

server:
  port: 9060