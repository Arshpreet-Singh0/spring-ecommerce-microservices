name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (Surefire), Testcontainers ITs (Failsafe; Docker is preinstalled on ubuntu-latest),
      # JaCoCo report + coverage gate (jacoco:check fails the build below jacoco.line.minimum).
      - name: Build, unit + integration tests, coverage gate
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
