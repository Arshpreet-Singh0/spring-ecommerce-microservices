spring.application.name=user-service
server.port=9010

# --- Database (secrets have no default: the app fails fast if DB_PASSWORD is missing) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USERNAME:user_svc}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Security: HS256 needs a secret of at least 32 bytes ---
jwt.secretKey=${JWT_SECRET}

# --- Service discovery ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
# Register with the container IP, not the (unresolvable) container hostname
eureka.instance.prefer-ip-address=true

# --- Actuator: health only (used by Docker healthchecks, later by K8s probes) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
